<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fire Department Staff – Hudson Fire Department</title>
  <link rel="icon" href="HFDLogo.png">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,Helvetica,sans-serif;background:#f0f0f0;color:#1a1a1a}
    header{background:#b30000;color:#fff;padding:28px 20px;text-align:center;box-shadow:0 3px 10px #0004}
    header h1{font-size:clamp(1.8rem,4vw,3rem);letter-spacing:.08em}
    header p{margin-top:6px;font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;color:#faa}
    nav{background:#222;padding:12px 16px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0006}
    nav a{color:#fff;text-decoration:none;margin:0 10px;font-weight:bold;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
    nav a:hover{color:#f88}
    .section-banner{position:relative;width:100%;height:130px;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .section-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
    .section-banner::after{content:"";position:absolute;inset:0;background:#0009;border-left:6px solid #b30000}
    .section-banner h2{position:relative;z-index:1;color:#fff;font-size:clamp(1.4rem,3vw,2.2rem);letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 12px #000b}
    .roster-grid{max-width:1100px;margin:0 auto;padding:36px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
    .member-card{background:#fff;border-radius:12px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 2px 10px #00000017;transition:.25s}
    .member-card:hover{box-shadow:0 8px 28px #00000029;transform:translateY(-3px)}
    .avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #b3000040;margin-bottom:12px;background:#e0e0e0}
    .positions{list-style:none;padding:0;margin:8px 0 6px;display:flex;flex-direction:column;gap:4px;font-size:.7rem;font-weight:800;color:#b30000;text-transform:uppercase;letter-spacing:.08em}
    .name{font-size:.9rem;font-weight:600}
    .status-message{max-width:1100px;margin:0 auto;padding:20px 20px 0;color:#555;text-align:center}
    footer{background:#222;color:#aaa;text-align:center;padding:20px;margin-top:24px;font-size:.85rem}
  </style>
</head>
<body>
<header><h1>Hudson Fire Department</h1><p>Meet Our Team</p></header>
<nav>
  <a href="index.html">Home</a><a href="History.html">History</a><a href="Burn Report.html">Controlled Burns</a>
  <a href="FundraisersPageDone.html">Fundraisers</a><a href="Staff.html">Staff</a><a href="Apply Now!.html">Apply Now</a>
</nav>

<div class="section-banner"><img src="Comand.jpg" alt="Command Staff"><h2>Command Staff</h2></div>
<div class="roster-grid" id="command-staff-roster"></div>

<div class="section-banner"><img src="Operations.jpg" alt="Operations"><h2>Operations</h2></div>
<div class="roster-grid" id="operations-roster"></div>

<div class="section-banner"><img src="Members.jpg" alt="Members"><h2>Members</h2></div>
<div class="roster-grid" id="members-roster"></div>

<div class="section-banner"><img src="Juniors.jpg" alt="Junior Firefighters"><h2>Junior Firefighters</h2></div>
<div class="roster-grid" id="juniors-roster"></div>

<p id="status-message" class="status-message">Loading staff roster...</p>

<script>
  const STAFF_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzi2-vIHNjzidUWoKsgI9rcoZi_zl8WTwjoiPCtttPZ3kLRqkagp7oYVAJzdVfkuVBRo0gvaxWu3DQ/pub?gid=890444595&single=true&output=csv";

  function parseDelimited(text) {
    const rows = [];
    let row = [];
    let value = "";
    let quoted = false;

    for (let i = 0; i < text.length; i += 1) {
      const character = text[i];
      const next = text[i + 1];

      if (character === '"' && quoted && next === '"') {
        value += '"';
        i += 1;
      } else if (character === '"') {
        quoted = !quoted;
      } else if ((character === "," || character === "\t") && !quoted) {
        row.push(value.trim());
        value = "";
      } else if ((character === "\n" || character === "\r") && !quoted) {
        if (character === "\r" && next === "\n") i += 1;
        row.push(value.trim());
        if (row.some((cell) => cell !== "")) rows.push(row);
        row = [];
        value = "";
      } else {
        value += character;
      }
    }

    if (value || row.length) {
      row.push(value.trim());
      if (row.some((cell) => cell !== "")) rows.push(row);
    }

    if (rows.length < 2) return [];

    const headers = rows[0].map((header) => header.replace(/^\uFEFF/, "").trim().toLowerCase());
    return rows.slice(1).map((cells) => {
      const person = {};
      headers.forEach((header, index) => {
        person[header] = (cells[index] || "").trim();
      });
      return person;
    });
  }

  function escapeHtml(value) {
    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function normalizeArea(value) {
    return (value || "").toLowerCase().trim().replace(/\s+/g, " ");
  }

  function matchesArea(person, names) {
    return names.includes(normalizeArea(person.area));
  }

  function buildCard(person) {
    const name = person["member name"] || person.name || "";
    const photo = person["profile photo"] || person.photo || "";
    const positionText = person.position || person["position "] || "";
    const positions = positionText
      .split(/[;|]/)
      .map((position) => position.trim())
      .filter(Boolean);

    return `
      <article class="member-card">
        ${photo ? `<img class="avatar" src="${encodeURI(photo)}" alt="${escapeHtml(name)}">` : ""}
        <ul class="positions">${positions.map((position) => `<li>${escapeHtml(position)}</li>`).join("")}</ul>
        <p class="name">${escapeHtml(name)}</p>
      </article>
    `;
  }

  function renderArea(targetId, people) {
    const target = document.getElementById(targetId);
    if (!target) return;
    target.innerHTML = people.length ? people.map(buildCard).join("") : '<p class="status-message">No active staff members in this section.</p>';
  }

  async function loadStaff() {
    const response = await fetch(STAFF_SHEET_URL + "&cache=" + Date.now());
    if (!response.ok) throw new Error("The staff sheet could not be loaded. Check the published CSV URL.");

    const rows = parseDelimited(await response.text());
    if (!rows.length) throw new Error("No rows were found in the published sheet.");

    const activePeople = rows.filter((person) => {
      const activeValue = (person.active || "").toLowerCase();
      return ["active", "true", "yes"].includes(activeValue);
    });

    renderArea("command-staff-roster", activePeople.filter((person) => matchesArea(person, ["command staff", "command"])));
    renderArea("operations-roster", activePeople.filter((person) => matchesArea(person, ["operations", "operation"])));
    renderArea("members-roster", activePeople.filter((person) => matchesArea(person, ["members", "member", "firefighters", "firefighter"])));
    renderArea("juniors-roster", activePeople.filter((person) => matchesArea(person, ["juniors", "junior", "junior firefighters", "junior firefighter"])));

    const total = activePeople.length;
    document.getElementById("status-message").textContent = `${total} active staff member(s) loaded from the Google Sheet.`;
  }

  loadStaff().catch((error) => {
    console.error(error);
    document.getElementById("status-message").textContent = "The staff spreadsheet could not be loaded: " + error.message;
  });
</script>
<footer><p>© 2026 Hudson Fire Department</p></footer>
</body>
</html>
